# Local environment of the Strangler Fig setup: every service has left the monolith, so this file
# only builds the extracted services and the gateway in front on http://localhost:8000. Each one
# is built from a clone next to this repository (change DRIVER_MANAGEMENT_CONTEXT,
# PAYMENTS_SETTLEMENT_CONTEXT, TRIP_PLANNING_MATCHING_CONTEXT or BOOKING_PRICING_CONTEXT
# otherwise) and is only reachable through the gateway.
# Copy .env.example to .env and set the secrets before running: docker compose up --build
services:
  driver-management-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: driver_management
      POSTGRES_USER: ${DB_USER:-shareway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - driver-management-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  driver-management:
    build: ${DRIVER_MANAGEMENT_CONTEXT:-../shareway-driver-management-service}
    depends_on:
      driver-management-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://driver-management-db:5432/driver_management
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-shareway}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_PATH: /app/storage
    volumes:
      - document-storage:/app/storage

  payments-settlement-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments_settlement
      POSTGRES_USER: ${DB_USER:-shareway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - payments-settlement-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-settlement:
    build: ${PAYMENTS_SETTLEMENT_CONTEXT:-../shareway-payments-settlement-service}
    depends_on:
      payments-settlement-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payments-settlement-db:5432/payments_settlement
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-shareway}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}

  trip-planning-matching-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trip_planning_matching
      POSTGRES_USER: ${DB_USER:-shareway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - trip-planning-matching-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No authentication of its own: only the gateway reaches it.
  trip-planning-matching:
    build: ${TRIP_PLANNING_MATCHING_CONTEXT:-../shareway-trip-planning-matching-service}
    depends_on:
      trip-planning-matching-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://trip-planning-matching-db:5432/trip_planning_matching
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-shareway}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

  booking-pricing-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shareway_booking
      POSTGRES_USER: ${DB_USER:-shareway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - booking-pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-pricing:
    build: ${BOOKING_PRICING_CONTEXT:-../shareway-booking-pricing}
    depends_on:
      booking-pricing-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://booking-pricing-db:5432/shareway_booking
      DB_USER: ${DB_USER:-shareway}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_PORT: 8080

  gateway:
    build: .
    depends_on:
      driver-management:
        condition: service_started
      payments-settlement:
        condition: service_started
      trip-planning-matching:
        condition: service_started
      booking-pricing:
        condition: service_started
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPSTREAM_MONOLITH: ${UPSTREAM_MONOLITH:-}
      UPSTREAM_DRIVER_MANAGEMENT: ${UPSTREAM_DRIVER_MANAGEMENT:-http://driver-management:8081}
      UPSTREAM_TRIP_PLANNING_MATCHING: ${UPSTREAM_TRIP_PLANNING_MATCHING:-http://trip-planning-matching:8081}
      UPSTREAM_BOOKING_PRICING: ${UPSTREAM_BOOKING_PRICING:-http://booking-pricing:8080}
      UPSTREAM_PAYMENTS_SETTLEMENT: ${UPSTREAM_PAYMENTS_SETTLEMENT:-http://payments-settlement:8085}
      UPSTREAM_TRIP_EXECUTION: ${UPSTREAM_TRIP_EXECUTION:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Lets an upstream that runs on the host, such as Trip Execution, be reached as
    # http://host.docker.internal:<port> on Linux as well.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"

volumes:
  driver-management-data:
  payments-settlement-data:
  trip-planning-matching-data:
  booking-pricing-data:
  document-storage:
